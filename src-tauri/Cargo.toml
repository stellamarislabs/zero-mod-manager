[package]
name = "zero-mod-manager"
version = "0.7.0-rc.2"
description = "An independent community mod manager for Star Wars: Zero Company"
authors = ["Zero Mod Manager contributors", "Victor Hugo (arctco)"]
edition = "2021"
license = "GPL-3.0-only"

[lib]
name = "zero_mod_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
thiserror = "2"
rusqlite = { version = "0.32", features = ["bundled", "backup"] }
sha2 = "0.10"
hex = "0.4"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
walkdir = "2"
zip = { version = "2", default-features = false, features = ["deflate", "bzip2", "zstd"] }
dirs = "6"
regex = "1"
tauri-plugin-single-instance = "2.4.3"
keyring = "4.1.6"
roxmltree = "0.21"
base64 = "0.22"
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "json", "stream", "http2", "charset"] }
ed25519-dalek = "2"
toml_edit = "0.22"

[dev-dependencies]
tempfile = "3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_System_Com", "Win32_System_Registry"] }
